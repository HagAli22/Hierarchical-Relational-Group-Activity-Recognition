<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Activity Recognition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }
        .upload-area {
            background: rgba(255,255,255,0.05);
            border: 2px dashed #444;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .upload-area.dragover { border-color: #00ff88; background: rgba(0,255,136,0.1); }
        .file-input { display: none; }
        .upload-btn {
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        .upload-btn:hover { transform: scale(1.05); }
        .file-name { color: #00ff88; margin-top: 10px; font-size: 0.9rem; }
        .predict-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa502);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .predict-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,107,107,0.3); }
        .predict-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result-area {
            margin-top: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            display: none;
        }
        .result-area.show { display: block; }
        .result-video {
            width: 100%;
            border-radius: 15px;
            background: #000;
        }
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .loading.show { display: block; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #888; margin-top: 10px; }
        .error { color: #ff6b6b; margin-top: 20px; padding: 15px; background: rgba(255,107,107,0.1); border-radius: 10px; display: none; }
        .error.show { display: block; }
        .classes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        .class-tag {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏐 Hierarchical Relational Network For Group Activity Recognition</h1>
        <p class="subtitle">Upload volleyball video to recognize group activity</p>
        
        <div class="upload-area" id="videoArea">
            <p>📹 Video File</p>
            <input type="file" id="videoInput" class="file-input" accept=".mp4,.avi,.mov">
            <button class="upload-btn" onclick="document.getElementById('videoInput').click()">Choose Video</button>
            <div class="file-name" id="videoName"></div>
        </div>
        
        <button class="predict-btn" id="predictBtn" onclick="predict()" disabled>🚀 Predict Activity</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing video...</p>
            <p class="status" id="status">This may take a moment</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-area" id="result">
            <h2 style="margin-bottom: 20px;">🎬 Result</h2>
            <video class="result-video" id="resultVideo" controls></video>
        </div>
        
        <div class="classes">
            <span class="class-tag">l-pass</span>
            <span class="class-tag">r-pass</span>
            <span class="class-tag">l-spike</span>
            <span class="class-tag">r-spike</span>
            <span class="class-tag">l-set</span>
            <span class="class-tag">r-set</span>
            <span class="class-tag">l-winpoint</span>
            <span class="class-tag">r-winpoint</span>
        </div>
    </div>

    <script>
        let videoFile = null;

        document.getElementById('videoInput').addEventListener('change', (e) => {
            videoFile = e.target.files[0];
            document.getElementById('videoName').textContent = videoFile ? videoFile.name : '';
            document.getElementById('predictBtn').disabled = !videoFile;
        });

        // Drag and drop
        const area = document.getElementById('videoArea');
        area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
        area.addEventListener('dragleave', () => area.classList.remove('dragover'));
        area.addEventListener('drop', (e) => {
            e.preventDefault();
            area.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file.type.includes('video')) {
                videoFile = file;
                document.getElementById('videoName').textContent = file.name;
                document.getElementById('predictBtn').disabled = false;
            }
        });

        async function predict() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            const btn = document.getElementById('predictBtn');

            loading.classList.add('show');
            result.classList.remove('show');
            error.classList.remove('show');
            btn.disabled = true;

            const formData = new FormData();
            formData.append('video', videoFile);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Prediction failed');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('resultVideo').src = url;
                result.classList.add('show');

            } catch (e) {
                error.textContent = '❌ ' + e.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
